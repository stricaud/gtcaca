name: Publish Rust crates to crates.io

# Trigger: any release tag (`v0.1.28`), or a Rust-only tag (`rust-v0.1.28`)
# when you want to ship the crates without cutting a full release.
#
# The tag is the version: set-version.sh stamps it into Cargo.toml before
# publishing, exactly like setuptools-scm does for the Python wheels. Nothing
# needs bumping by hand.
#
# One-time crates.io setup:
#   cargo login                              # on your machine
#   cargo publish -p gtcaca-sys --dry-run    # (from src/bindings/rust/, after sync-sources.sh)
#   Add CARGO_REGISTRY_TOKEN to repo secrets → Settings → Secrets → Actions

on:
  push:
    tags: ["v*", "rust-v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish gtcaca-sys + gtcaca
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Install libclang (bindgen) and libcaca (the one C dependency)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev libcaca-dev

      - name: Vendor C sources
        run: bash src/bindings/rust/scripts/sync-sources.sh

      - name: Stamp version from tag
        run: bash src/bindings/rust/scripts/set-version.sh

      - name: Publish gtcaca-sys
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        working-directory: src/bindings/rust
        # Idempotent: skip if this exact version is already on crates.io, so a
        # re-run of a tag (or a bump where only one crate changed) doesn't fail.
        run: bash ../../../.github/scripts/publish-crate.sh gtcaca-sys 30

      - name: Publish gtcaca
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        working-directory: src/bindings/rust
        run: bash ../../../.github/scripts/publish-crate.sh gtcaca
